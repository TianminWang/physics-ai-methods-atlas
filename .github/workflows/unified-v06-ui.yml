name: Unified method graph browser review

on:
  pull_request:
    paths:
      - 'viewer-v06/**'
      - 'scripts/build_v06.py'
      - 'tests/ui_v06.py'
      - '.github/workflows/unified-v06-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt playwright
      - run: python -m playwright install chromium --with-deps
      - run: python -m scripts.build_v06 --site build/viewer-v06
      - run: python tests/ui_v06.py
      - name: Upload real-browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v06-layout-review
          path: build/v06-screenshots/
          if-no-files-found: ignore
