name: Validate atlas data

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m scripts.validate
      - name: Install Graphviz and CJK fonts
        run: sudo apt-get update && sudo apt-get install -y graphviz fonts-noto-cjk
      - run: python -m pytest -q
      - run: python -m scripts.audit_v09 --output build/audit-v09.json
      - name: Upload methodology audit (non-canonical design report)
        uses: actions/upload-artifact@v4
        with:
          name: atlas-methodology-audit-v09
          path: build/audit-v09.json
          if-no-files-found: error
      - run: python -m scripts.export_unified --lang zh --output build/unified-zh.json
      - run: python -m scripts.export_unified --lang en --output build/unified-en.json
      - run: python -m scripts.build_v08 --site build/viewer-v08
      - run: node --check viewer-v08/app.js
      - name: Upload full-width v0.8 offline DAG
        uses: actions/upload-artifact@v4
        with:
          name: atlas-fullwidth-dag-v08
          path: build/viewer-v08/
          if-no-files-found: error
      - run: python -m scripts.build_v07 --site build/viewer-v07
      - run: node --check viewer-v07/app.js
      - name: Upload three-phase global DAG viewer
        uses: actions/upload-artifact@v4
        with:
          name: atlas-global-dag-v07
          path: build/viewer-v07/
          if-no-files-found: error
      - run: python -m scripts.export_graph
      - run: python -m scripts.build_v06 --site build/viewer-v06
      - run: node --check viewer-v06/app.js
      - name: Upload v0.6 unified offline viewer
        uses: actions/upload-artifact@v4
        with:
          name: atlas-unified-v06
          path: build/viewer-v06/
          if-no-files-found: error
      - run: python -m scripts.build_prototype --output build/prototype/data/preview.json --site build/prototype
      - run: node --check prototype/app.js
      - name: Upload interactive prototype artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-interactive-layout-v05
          path: build/prototype/
          if-no-files-found: error
