name: Validate atlas data

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m scripts.validate
      - run: python -m pytest -q
      - run: python -m scripts.export_unified --lang zh --output build/unified-zh.json
      - run: python -m scripts.export_unified --lang en --output build/unified-en.json
      - run: python -m scripts.export_graph
      - run: python -m scripts.build_prototype --output prototype/data/preview.json
      - run: node --check prototype/app.js
      - name: Upload interactive prototype artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-interactive-layout-v05
          path: prototype/
          if-no-files-found: error
