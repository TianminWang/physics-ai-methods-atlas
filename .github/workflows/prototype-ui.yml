name: Prototype UI smoke and screenshots

on:
  pull_request:
    paths:
      - 'prototype/**'
      - 'scripts/build_prototype.py'
      - 'tests/ui_smoke.py'
      - '.github/workflows/prototype-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt playwright
      - run: python -m playwright install chromium --with-deps
      - run: python -m scripts.build_prototype --site build/prototype
      - run: python tests/ui_smoke.py
      - name: Upload desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v05-layout-screenshots
          path: build/prototype-screenshots/
          if-no-files-found: ignore
